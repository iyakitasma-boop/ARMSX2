name: Android APK Only

# Build APK saja (tanpa macOS/Linux/iOS). Jalankan manual: tab Actions -> Android APK Only -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      app_label:
        description: "Nama app di layar utama"
        default: "UN5 Player"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      # Flavor "github" = APK sideload. Tanpa keystore, release otomatis ditandatangani debug key
      # sehingga langsung bisa diinstal.
      - name: Build APK
        run: ./gradlew :app:assembleGithubRelease -Parmsx2.appLabel="${{ inputs.app_label }}" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: un5-player-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
